packages:
  - apps/*
  - packages/*
# The OCI release wrapper runs pnpm 10.20.0. Keep this legacy list until that
# runtime is deliberately upgraded to a pnpm version that supports allowBuilds.
onlyBuiltDependencies:
  - argon2
  - better-sqlite3
  - esbuild
allowBuilds:
  argon2: true
  better-sqlite3: true
  esbuild: true
