name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - task/atoqueue-mvp

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .github deploy/scripts/*.mjs docs/operations/deployment-health-startup.md
      - run: pnpm lint
      - run: pnpm --filter @atoqueue/contracts build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
