name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - task/atoqueue-mvp

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: atoqueue_v2_test
          POSTGRES_USER: atoqueue_test
          POSTGRES_PASSWORD: local_ci_test_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .github deploy/scripts/*.mjs docs/operations/deployment-health-startup.md
      - run: pnpm lint
      - run: pnpm --filter @atoqueue/contracts build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node deploy/scripts/verify-notification-platform-postgres.mjs
        env:
          ATOQUEUE_TEST_DATABASE_URL: postgresql://atoqueue_test:local_ci_test_only@127.0.0.1:5432/atoqueue_v2_test
